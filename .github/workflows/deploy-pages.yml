# 自動部署前端單檔頁面（Cloudflare Pages）
#
# 需要的 secret 跟 Worker 那個 workflow 一樣，但 API token 權限要再加上
# Cloudflare Pages:Edit：
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# 第一次部署前，請先到 Cloudflare 儀表板 Workers & Pages → Create → Pages
# 建立一個名為 guoding 的專案（選「Direct Upload」即可），否則 CI 會找不到專案。
#
# 另外要設定一次 service binding，讓 /api/* 能轉給 guoding 這個 Worker：
#   guoding（Pages 專案）→ Settings → Functions → Service bindings
#   → Variable name 填 API、Service 選 guoding
# 沒設定的話 /api/* 會回 503，前端就會顯示連不上伺服器。
name: Deploy Pages

on:
  push:
    branches:
      - claude/expense-tracker-with-charts-9p3m2g
    paths:
      - 'index.html'
      - 'pages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 只放 index.html 和 Pages 的入口，避免把 worker 原始碼、README 一起發佈出去
      - name: 準備要上傳的檔案
        run: |
          mkdir -p dist
          cp index.html dist/
          cp pages/_worker.js dist/

      - name: 跑測試（/api 路由分派）
        run: node pages/router-test.mjs

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=guoding --branch=main
