# 自動部署雲端同步 API（Cloudflare Workers + D1）
#
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定兩個 secret：
#   CLOUDFLARE_API_TOKEN   權限需包含 Workers Scripts:Edit、D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 儀表板右側的 Account ID
name: Deploy Worker

on:
  push:
    branches:
      - claude/expense-tracker-with-charts-9p3m2g
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# 同一時間只跑一個部署，後來的會取消前面還在跑的
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: 安裝相依套件
        working-directory: worker
        run: npm ci

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
